defaults:
  - _self_
  - task: lift_image_abs

name: train_hybrid_dit_flow
_target_: diffusion_policy.workspace.train_diffusion_transformer_hybrid_workspace.TrainDiffusionTransformerHybridWorkspace

task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "hybrid_dit_beta"

horizon: 16       # 建议：DiT 通常能处理更长的 horizon，可以尝试从 10 增加到 16
n_obs_steps: 2
n_action_steps: 8
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
past_action_visible: False
keypoint_visible_rate: 1.0

policy:
  # [修改点 1] 指向你新保存的 Policy 文件和类名
  # 假设你把代码保存到了 ICT/policy/HybridDiT_policy.py
  _target_: ICT.policy.HybridDiT_policy.HybridDiTPolicy

  shape_meta: ${shape_meta}
  
  horizon: ${horizon}
  n_action_steps: ${eval:'${n_action_steps}+${n_latency_steps}'}
  n_obs_steps: ${n_obs_steps}
  
  # --- Flow Matching 推理参数 ---
  num_inference_steps: 100        # Euler 积分器建议 100 步以获得高精度，或者 50 步追求速度
  training_noise_sampling: "beta" # [强烈推荐] 使用 "beta" 分布采样 t (Pi0 论文做法)，通常比 "uniform" 收敛更快且效果更好
  time_dim: 256
  clip_sample: True               # 建议开启，防止推理时数值溢出
  clip_sample_range: 1.0

  # --- Hybrid DiT 架构参数 ---
  # [修改点 2] 核心 DiT 结构
  n_layer: 8        # 建议加深网络，DiT 一般比 UNet 深
  n_head: 8           # 确保 n_emb 能被 n_head 整除 (512/8 = 64 dim per head)
  n_emb: 256          # 512 是一个很好的起点，显存够可以用 768
  p_drop_emb: 0.1
  p_drop_attn: 0.1    # Attention Dropout 有助于防止过拟合
  
  # [修改点 3] 新增参数：Condition Encoder 深度
  n_cond_layers: 2    # 2 层 Transformer Encoder 用于处理历史观测序列通常足够了

  # --- 视觉 Encoder 参数 (保持不变) ---
  crop_shape: [76, 76]
  obs_encoder_group_norm: True
  eval_fixed_crop: True

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128      # 如果显存不足，可能需要从 128 降到 64，因为 Cross-Attention 增加了计算量
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  transformer_weight_decay: 1.0e-3
  obs_encoder_weight_decay: 1.0e-5 # 稍微增加一点 vision encoder 的正则化
  learning_rate: 3.0e-4            # DiT 通常可以承受稍大的 LR (例如 3e-4)
  betas: [0.9, 0.95]

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500             # DiT 需要预热，500-1000 步合适
  num_epochs: 3050
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 50
  checkpoint_every: 50
  val_every: 1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  project: DiT_ode_hybrid
  resume: True
  mode: online
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "HybridDiT", "BetaSampling"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 5
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True
  save_last_snapshot: False

multi_run:
  run_dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: data/outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}